  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ===================================================== -->
<!--  PÁGINA DE ORÇAMENTO                                  -->
<!-- ===================================================== -->
<div class="page" id="page-orcamento">
  <a href="chat.html" class="back-btn text-decoration-none">← Voltar</a>
  <div class="orcamento-page">
    <div class="orcamento-card">
      <h1>Elaborar Orçamento</h1>
      <p class="orcamento-subtitle">Preencha os dados do orçamento para o cliente</p>
      <form class="orcamento-form" onsubmit="return false;">
        <div class="form-group">
          <label>Título do Orçamento</label>
          <input type="text" placeholder="Insira o Título">
        </div>
        <div class="orcamento-row">
          <div class="form-group" style="flex:1;">
            <label>Data</label>
            <input type="date" placeholder="Data">
          </div>
          <div class="form-group" style="flex:1;">
            <label>Nome do Cliente</label>
            <input type="text" placeholder="Nome do cliente">
          </div>
        </div>
        <div class="form-group">
          <label>Endereço do Cliente</label>
          <input type="text" placeholder="Endereço do cliente">
        </div>
        <div class="form-group">
          <label>Valor Estimado (R$)</label>
          <input type="text" placeholder="Valor estimado">
        </div>
        <div class="form-group">
          <label>Fotos e Vídeos do Problema</label>
          <div class="orcamento-imgs">
            <div class="orcamento-img-box" style="cursor:pointer;">🖼️</div>
            <div class="orcamento-img-box" style="cursor:pointer;">＋</div>
          </div>
        </div>
        <div class="form-group">
          <label>Descrição do Problema</label>
          <textarea placeholder="Detalhe o problema do cliente..."></textarea>
        </div>
        <div class="form-group">
          <label>Descrição do Serviço</label>
          <textarea placeholder="Detalhe o que planeja para resolver o problema..."></textarea>
        </div>
        <div class="orcamento-actions">
          <a href="chat.html" class="btn-primary text-decoration-none text-center d-flex align-items-center justify-content-center" style="flex:1;">Enviar</a>
          <a href="conversas.html" class="btn-secondary text-decoration-none text-center d-flex align-items-center justify-content-center" style="flex:1;">Salvar</a>
        </div>
      </form>
    </div>
  </div>
</div>

</body>
</html>
