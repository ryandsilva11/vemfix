  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ===== NAVBAR ===== -->
<nav class="navbar navbar-expand-lg navbar-light bg-white sticky-top shadow-sm">
  <div class="container-fluid">
    <a class="nav-logo text-decoration-none" href="index.html">

<!-- ===================================================== -->
<!--  CADASTRO PAGE                                        -->
<!-- ===================================================== -->
<div class="page" id="page-cadastro">
  <a href="index.html" class="back-btn text-decoration-none">← Voltar</a>
  <div class="cadastro-page">
    <div class="cadastro-card">
      <h1>Crie sua Conta</h1>
      <p class="cadastro-subtitle">Rápido e simples — comece em menos de 1 minuto</p>
      
      <input type="radio" name="cadastro_tab" id="tab-opt-cliente" checked hidden>
      <input type="radio" name="cadastro_tab" id="tab-opt-prestador" hidden>

      <div class="tabs">
        <label for="tab-opt-cliente" class="tab">Sou Cliente</label>
        <label for="tab-opt-prestador" class="tab">Sou Prestador</label>
      </div>

      <div id="tab-cliente" class="tab-content">
        <form class="cadastro-form" onsubmit="return false;">
          <div class="form-group"><label>Nome completo</label><input type="text" placeholder="Seu nome"></div>
          <div class="form-group"><label>E-mail</label><input type="email" placeholder="seu@email.com"></div>
          <div class="form-group"><label>Telefone</label><input type="tel" placeholder="(11) 99999-9999"></div>
          <div class="form-group"><label>Cidade</label><input type="text" placeholder="Sua cidade"></div>
          <div class="form-group"><label>CPF</label><input type="text" placeholder="000.000.000-00"></div>
          <div class="form-group"><label>Data de nascimento</label><input type="date"></div>
          <div class="form-group"><label>Senha</label><input type="password" placeholder="Mínimo 8 dígitos, 1 maiúscula, 1 especial"></div>
          <div class="cadastro-terms"><input type="checkbox" id="termos-c"> <label for="termos-c">Concordo com os <a href="garantias.html">Termos de Uso e Política de Privacidade</a></label></div>
          <a href="index.html" class="btn-primary text-decoration-none text-center d-block">Criar Conta</a>
          <p class="cadastro-footer">Já tem conta? <a href="index.html">Entrar</a></p>
        </form>
      </div>

      <div id="tab-prestador" class="tab-content" style="display:none;">
        <form class="cadastro-form" onsubmit="return false;">
          <div class="form-group"><label>Nome completo</label><input type="text" placeholder="Seu nome"></div>
          <div class="form-group"><label>E-mail</label><input type="email" placeholder="seu@email.com"></div>
          <div class="form-group"><label>Telefone</label><input type="tel" placeholder="(11) 99999-9999"></div>
          <div class="form-group"><label>Cidade</label><input type="text" placeholder="Sua cidade"></div>
          <div class="form-group"><label>Categoria de Serviço</label>
            <select>
              <option>Encanador</option><option>Eletricista</option><option>Pintor</option><option>Jardineiro</option>
              <option>Limpeza</option><option>Pedreiro</option><option>Ar condicionado</option><option>Chaveiro</option>
            </select>
          </div>
          <div class="form-group"><label>Breve descrição da experiência</label><textarea placeholder="Conte um pouco sobre sua experiência..."></textarea></div>
          <div class="form-group"><label>Senha</label><input type="password" placeholder="Mínimo 8 dígitos, 1 maiúscula, 1 especial"></div>
          <div class="cadastro-terms"><input type="checkbox" id="termos-p"> <label for="termos-p">Concordo com os <a href="garantias.html">Termos de Uso e Política de Privacidade</a></label></div>
          <a href="index.html" class="btn-primary text-decoration-none text-center d-block">Criar Conta</a>
          <p class="cadastro-footer">Já tem conta? <a href="index.html">Entrar</a></p>
        </form>
      </div>
    </div>
  </div>
</div>

</body>
</html>
