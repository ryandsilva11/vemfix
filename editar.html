  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ===== NAVBAR ===== -->
<nav class="navbar navbar-expand-lg navbar-light bg-white sticky-top shadow-sm">
  <div class="container-fluid">
    <a class="nav-logo text-decoration-none" href="index.html">
      <div class="logo-icon">V</div>
      VemFix
    </a>
    <div class="nav-links">
      <a href="index.html" id="nav-home">Início</a>

<!-- ===================================================== -->
<!--  EDITAR PERFIL PAGE                                   -->
<!-- ===================================================== -->
<div class="page" id="page-editar">
  <div class="edit-page" style="padding-top:32px;">
    <a href="index.html" class="back-btn text-decoration-none" style="padding:0;margin-bottom:20px;display:inline-block;">← Voltar</a>
    <div class="edit-card">
      <div class="edit-avatar-wrap">
        <div class="edit-avatar" title="Foto do perfil">RD</div>
        <span style="font-size:12px;opacity:0.8;">Trocar foto</span>
      </div>
      <form class="edit-fields" onsubmit="return false;">
        <input class="edit-field" type="text" value="Ryan Dias da Silva" placeholder="Nome completo">
        <input class="edit-field" type="tel" value="(11) 9583-57641" placeholder="Telefone">
        <input class="edit-field" type="text" value="Salto - SP" placeholder="Cidade - Estado">
        <select class="edit-field" title="Tipo de prestador">
          <option value="">Selecione seu tipo de profissão</option>
          <option value="pedreiro">Pedreiro</option>
          <option value="jardineiro">Jardineiro</option>
          <option value="pintor">Pintor</option>
          <option value="eletricista">Eletricista</option>
          <option value="encanador">Encanador</option>
          <option value="carpinteiro">Carpinteiro</option>
          <option value="marceneiro">Marceneiro</option>
          <option value="mecanico">Mecânico</option>
          <option value="limpeza">Serviço de Limpeza</option>
          <option value="aula">Professor / Aulas</option>
          <option value="design">Design / Criativo</option>
          <option value="reparos">Reparos em Geral</option>
          <option value="outro">Outro</option>
        </select>
        <div class="edit-btns">
          <button type="button" class="btn-inativar">Inativar conta</button>
          <a href="index.html" class="btn-salvar text-decoration-none text-center d-flex align-items-center justify-content-center">Salvar e Sair</a>
        </div>
      </form>
    </div>
  </div>
</div>

</body>
</html>
