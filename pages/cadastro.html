<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VemFix – Cadastro</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/cadastro.css">
</head>

<body>

  <!-- NAVBAR -->
  <nav>
    <a href="../index.html" class="nav-logo">
      <div class="logo-icon">V</div>
      VemFix
    </a>
    <div class="nav-links">
      <a href="../index.html">Início</a>
      <a href="busca.html">Busca</a>
      <a href="garantias.html">Garantias</a>
      <a href="suporte.html">Suporte</a>
      <a href="conversas.html">Chat</a>
    </div>
    <div class="nav-actions">
      <a href="busca.html" class="search-icon-btn" title="Buscar">🔍</a>
      <a href="cadastro.html" class="btn btn-primary btn-sm">Cadastrar</a>
    </div>
  </nav>

  <a href="../index.html" class="back-btn">← Voltar</a>

  <div class="page-container">
    <div class="card">
      <h1>Crie sua Conta</h1>
      <p class="card-sub">Rápido e simples — comece em menos de 1 minuto</p>

      <input type="radio" name="tab" id="tab-opt-c" checked hidden>
      <input type="radio" name="tab" id="tab-opt-p" hidden>

      <div class="tabs">
        <label for="tab-opt-c" class="tab">Sou Cliente</label>
        <label for="tab-opt-p" class="tab">Sou Prestador</label>
      </div>

      <!-- CLIENTE -->
      <div id="tab-c">
        <div>
          <div class="form-group"><label>Nome completo</label><input type="text" placeholder="Seu nome"></div>
          <div class="form-group"><label>E-mail</label><input type="email" placeholder="seu@email.com"></div>
          <div class="form-row">
            <div class="form-group"><label>Telefone</label><input type="tel" placeholder="(11) 99999-9999"></div>
            <div class="form-group"><label>Cidade</label><input type="text" placeholder="Sua cidade"></div>
          </div>
          <div class="form-row">
            <div class="form-group"><label>CPF</label><input type="text" placeholder="000.000.000-00"></div>
            <div class="form-group"><label>Data de nascimento</label><input type="date"></div>
          </div>
          <div class="form-group"><label>Senha</label><input type="password" placeholder="Mínimo 8 dígitos"></div>
          <div class="form-terms"><input type="checkbox" id="tc"> <label for="tc">Concordo com os <a
                href="garantias.html">Termos de Uso e Privacidade</a></label></div>
          <a href="../index.html" class="btn btn-primary btn-full">Criar Conta</a>
          <p class="form-footer">Já tem conta? <a href="../index.html">Entrar</a></p>
        </div>
      </div>

      <!-- PRESTADOR -->
      <div id="tab-p" style="display:none;">
        <div>
          <div class="form-group"><label>Nome completo</label><input type="text" placeholder="Seu nome"></div>
          <div class="form-group"><label>E-mail</label><input type="email" placeholder="seu@email.com"></div>
          <div class="form-row">
            <div class="form-group"><label>Telefone</label><input type="tel" placeholder="(11) 99999-9999"></div>
            <div class="form-group"><label>Cidade</label><input type="text" placeholder="Sua cidade"></div>
          </div>
          <div class="form-group">
            <label>Categoria de Serviço</label>
            <select>
              <option>Encanador</option>
              <option>Eletricista</option>
              <option>Pintor</option>
              <option>Jardineiro</option>
              <option>Limpeza</option>
              <option>Pedreiro</option>
              <option>Ar condicionado</option>
              <option>Chaveiro</option>
            </select>
          </div>
          <div class="form-group"><label>Breve descrição da experiência</label><textarea
              placeholder="Conte um pouco sobre sua experiência..."></textarea></div>
          <div class="form-group"><label>Senha</label><input type="password" placeholder="Mínimo 8 dígitos"></div>
          <div class="form-terms"><input type="checkbox" id="tp"> <label for="tp">Concordo com os <a
                href="garantias.html">Termos de Uso e Privacidade</a></label></div>
          <a href="../index.html" class="btn btn-primary btn-full">Criar Conta</a>
          <p class="form-footer">Já tem conta? <a href="../index.html">Entrar</a></p>
        </div>
      </div>
    </div>
  </div>

</body>

</html>
