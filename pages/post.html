<div class="page-container">
  <div class="card">
    <h1>Criar Post</h1>
    <p class="card-sub">Compartilhe seu trabalho com a comunidade</p>

    <div>
      <div class="form-group">
        <label>Título (obrigatório)</label>
        <input type="text" placeholder="Título do seu post">
      </div>
      <div class="form-group">
        <label>Anexos</label>
        <div class="upload-box">
          <div style="font-size:32px;margin-bottom:6px;">🖼️</div>
          Adicionar Anexos (fotos ou vídeos)
        </div>
      </div>
      <div class="form-group">
        <label>Descrição (opcional)</label>
        <textarea placeholder="Descreva seu trabalho..."></textarea>
      </div>
      <a href="busca.html" class="btn btn-primary btn-full" style="margin-top:8px;">Publicar Post</a>
    </div>
  </div>
</div>
