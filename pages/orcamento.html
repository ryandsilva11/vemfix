<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VemFix – Elaborar Orçamento</title>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/orcamento.css">
</head>
<body>

<!-- NAVBAR -->
<nav>
  <a href="../index.html" class="nav-logo">
    <div class="logo-icon">V</div>
    VemFix
  </a>
  <div class="nav-links">
    <a href="../index.html">Início</a>
    <a href="busca.html">Busca</a>
    <a href="garantias.html">Garantias</a>
    <a href="suporte.html">Suporte</a>
    <a href="conversas.html">Chat</a>
  </div>
  <div class="nav-actions">
    <a href="busca.html" class="search-icon-btn" title="Buscar">🔍</a>
    <a href="cadastro.html" class="btn btn-primary btn-sm">Cadastrar</a>
  </div>
</nav>

<a href="chat.html" class="back-btn">← Voltar</a>

<div class="page-container">
  <div class="card">
    <h1>Elaborar Orçamento</h1>
    <p class="card-sub">Preencha os dados do orçamento para o cliente</p>

    <div>
      <div class="form-group">
        <label>Título do Orçamento</label>
        <input type="text" placeholder="Insira o título">
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Data</label>
          <input type="date">
        </div>
        <div class="form-group">
          <label>Nome do Cliente</label>
          <input type="text" placeholder="Nome do cliente">
        </div>
      </div>
      <div class="form-group">
        <label>Endereço do Cliente</label>
        <input type="text" placeholder="Endereço do cliente">
      </div>
      <div class="form-group">
        <label>Valor Estimado (R$)</label>
        <input type="text" placeholder="Ex: 150,00">
      </div>
      <div class="form-group">
        <label>Fotos e Vídeos do Problema</label>
        <div class="upload-box">
          <span style="font-size:24px;">📷</span> Adicionar fotos do local
        </div>
      </div>
      <div class="form-group">
        <label>Descrição do Problema</label>
        <textarea placeholder="Detalhe o problema identificado..."></textarea>
      </div>
      <div class="form-group">
        <label>Descrição do Serviço</label>
        <textarea placeholder="Detalhe o serviço planejado..."></textarea>
      </div>
      <div style="display:flex;gap:12px;margin-top:12px;">
        <a href="chat.html" class="btn btn-primary" style="flex:1;">Enviar ao Cliente</a>
        <a href="conversas.html" class="btn btn-secondary" style="flex:1;">Salvar Rascunho</a>
      </div>
    </div>
  </div>
</div>

</body>
</html>
