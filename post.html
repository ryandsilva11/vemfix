<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VemFix – Criar Post</title>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700;800&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ===== NAVBAR ===== -->
<nav class="navbar navbar-expand-lg navbar-light bg-white sticky-top shadow-sm">
  <div class="container-fluid">
    <a class="nav-logo text-decoration-none" href="index.html">
      <div class="logo-icon">V</div>
      VemFix
    </a>
    <div class="nav-links">
      <a href="index.html" id="nav-home">Início</a>
      <a href="busca.html" id="nav-busca">Busca</a>
      <a href="garantias.html" id="nav-garantias">Garantias</a>
      <a href="suporte.html" id="nav-suporte">Suporte</a>
      <a href="conversas.html" id="nav-conversas">Chat</a>
    </div>
    <div class="nav-actions">
      <a href="busca.html" class="nav-search-btn btn btn-outline-secondary" title="Buscar">🔍</a>
      <a href="cadastro.html" class="btn-cadastrar btn btn-success text-decoration-none">Cadastrar</a>
    </div>
  </div>
</nav>

<!-- ===================================================== -->
<!--  PÁGINA DE POST                                       -->
<!-- ===================================================== -->
<div class="page" id="page-post">
  <a href="busca.html" class="back-btn text-decoration-none">← Voltar</a>
  <div class="post-page">
    <div class="post-card">
      <h1>Criar Post</h1>
      <p class="post-subtitle">Compartilhe seu trabalho com a comunidade</p>
      <form class="post-form" onsubmit="return false;">
        <div class="form-group">
          <label>Título (obrigatório)</label>
          <input type="text" placeholder="Título do seu post">
        </div>
        <div class="form-group">
          <label>Anexos</label>
          <div class="upload-box" style="cursor:pointer;">
            <div class="icon">🖼️</div>
            Adicionar Anexos (imagens ou vídeos)
          </div>
        </div>
        <div class="form-group">
          <label>Descrição (opcional)</label>
          <textarea placeholder="Descreva seu trabalho..." style="min-height:120px;"></textarea>
        </div>
        <a href="busca.html" class="btn-primary text-decoration-none text-center d-block" style="width:100%;">Publicar Post</a>
      </form>
    </div>
  </div>
</div>

</body>
</html>
